# Regtest lab node — INSECURE ON PURPOSE.
# This file exists so you can watch node_audit.py detect every classic
# exposure mistake. It is regtest-only (no real coins, throwaway chain) and
# the compose file publishes it only to 127.0.0.1 on your host — never to a
# LAN or the internet. Do NOT copy these settings to a real node.
regtest=1
server=1
printtoconsole=1

# MISTAKE 1: plaintext credentials in the config file.
rpcuser=admin
rpcpassword=123456

# MISTAKE 2: RPC listens on every interface.
rpcbind=0.0.0.0

# MISTAKE 3: RPC accepts connections from anywhere.
rpcallowip=0.0.0.0/0

[regtest]
rpcport=18443
