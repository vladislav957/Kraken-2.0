# lnd — HARDENED reference. Control interfaces on loopback, macaroons on.
[Application Options]
rpclisten=127.0.0.1:10009
restlisten=127.0.0.1:8080
listen=0.0.0.0:9735
# macaroons enabled (do NOT set no-macaroons). Hand apps scoped macaroons,
# never admin.macaroon. Keep ~/.lnd 0700 and admin.macaroon 0600.
[Bitcoin]
bitcoin.active=1
bitcoin.regtest=1
bitcoin.node=bitcoind
