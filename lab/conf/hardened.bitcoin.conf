# Regtest lab node — HARDENED config.
# RPC is localhost-only and uses cookie auth (no plaintext secret).
# Access it the correct way, from the host:
#     docker compose exec node-hardened bitcoin-cli -regtest getblockchaininfo
regtest=1
server=1
printtoconsole=1

# RPC bound to loopback inside the container, restricted to loopback.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

[regtest]
rpcport=18443
